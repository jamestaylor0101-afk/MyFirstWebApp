<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tottenham Hotspur Player Database</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Tottenham Hotspur Player Database</h1>
        <p>Welcome to the Tottenham Hotspur player database.</p>
    </header>

    <main>

        <section class="players">

            <h2>Select a Player</h2>

            <form>

                <label for="player">Choose a player:</label>

                <select id="player" name="player">

                    <option value="">-- Select a player --</option>
                    <option value="savio">Savio</option>
                    <option value="maddison">James Maddison</option>
                    <option value="kulusevski">Dejan Kulusevski</option>
                    <option value="marmoush">Omar Marmoush</option>
                    <option value="vanderven">Micky van de Ven</option>

                </select>

                <button type="submit">View Player</button>

            </form>

        </section>

        <section class="player-information">

            <h2>Player Information</h2>

            <p>Select a player to view more information.</p>

        </section>

    </main>

    <footer>
        <p>Tottenham Hotspur Player Database</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
